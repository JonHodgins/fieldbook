<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan trip</title>
<link rel="icon" href="mark.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#174e40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taiwan trip">
<meta name="robots" content="noindex, nofollow">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f9f5;color:#223c32;font:16px/1.5 Inter,Arial,sans-serif}
form{width:min(340px,100% - 48px);text-align:center}
img{width:56px}
h1{font:500 30px Georgia,serif;margin:12px 0 18px}
input,button{width:100%;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid #cdd6cf;margin-top:10px}
button{background:#255c48;border-color:#255c48;color:#fff;font-weight:600}
p{color:#78281e;min-height:24px;margin:10px 0 0}
</style>
</head>
<body>
<form id="lock" hidden>
  <img src="mark.svg" alt="">
  <h1>Taiwan trip</h1>
  <label for="pass">Passphrase</label>
  <input id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button>Open</button>
  <p id="msg" role="alert"></p>
</form>
<script>
(function () {
  var FILE = 'friends.enc', ITER = 20000, KEY = 'fieldbook-friends-pass';
  var form = document.getElementById('lock'), msg = document.getElementById('msg');
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function decrypt(pass) {
    return fetch(FILE).then(function (r) { if (!r.ok) throw new Error('load'); return r.arrayBuffer(); }).then(function (buf) {
      var salt = new Uint8Array(buf, 8, 8), data = new Uint8Array(buf, 16);
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']).then(function (km) {
        return crypto.subtle.deriveBits({name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256'}, km, 384);
      }).then(function (bits) {
        return crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']).then(function (key) {
          return crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, data);
        });
      }).then(function (plain) {
        var html = new TextDecoder().decode(plain);
        if (html.slice(0, 9).toLowerCase() !== '<!doctype') throw new Error('pass');
        return html;
      }, function () { throw new Error('pass'); });
    });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask(text) { form.hidden = false; msg.textContent = text || ''; document.getElementById('pass').focus(); }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = document.getElementById('pass').value.trim();
    msg.textContent = '';
    decrypt(pass).then(function (html) { try { localStorage.setItem(KEY, pass); } catch (err) {} show(html); },
      function (err) { ask(err.message === 'load' ? 'The page did not load. Check the network and try again.' : 'That passphrase is not correct.'); });
  });
  var pass = saved();
  if (!pass) { ask(); return; }
  decrypt(pass).then(show, function (err) { ask(err.message === 'load' ? 'The page did not load. Check the network and try again.' : ''); });
})();
</script>
</body>
</html>
